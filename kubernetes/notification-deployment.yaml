apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: smart-task
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      imagePullSecrets:
        - name: harbor-secret
      containers:
        - name: notification-service
          image: 18.208.228.77:8081/smart-task-k8/notification-service:latest
          ports:
            - containerPort: 5003
          env:
            - name: PORT
              value: "5003"
            - name: MONGO_URI
              value: "mongodb://mongodb:27017/notificationdb"
            - name: JWT_SECRET
              value: "MySecret@123"

---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: smart-task
spec:
  selector:
    app: notification-service
  ports:
    - port: 5003
      targetPort: 5003
