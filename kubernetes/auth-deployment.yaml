apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: smart-task
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      imagePullSecrets:
        - name: harbor-secret
      containers:
        - name: auth-service
          image: 18.208.228.77:8081/smart-task-k8/auth-service:latest
          ports:
            - containerPort: 5001
          env:
            - name: PORT
              value: "5001"
            - name: MONGO_URI
              value: "mongodb://mongodb:27017/authdb"
            - name: JWT_SECRET
              value: "MySecret@123"

---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: smart-task
spec:
  selector:
    app: auth-service
  ports:
    - port: 5001
      targetPort: 5001
