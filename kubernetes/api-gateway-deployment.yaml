apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: smart-task
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      imagePullSecrets:
        - name: harbor-secret
      containers:
        - name: api-gateway
          image: 18.208.228.77:8081/smart-task/api-gateway:latest
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:5001"
            - name: TASK_SERVICE_URL
              value: "http://task-service:5002"
            - name: JWT_SECRET
              value: "MySecret@123"

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: smart-task
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30001
