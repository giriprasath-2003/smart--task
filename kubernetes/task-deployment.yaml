apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-service
  namespace: smart-task
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-service
  template:
    metadata:
      labels:
        app: task-service
    spec:
      imagePullSecrets:
        - name: harbor-secret
      containers:
        - name: task-service
          image: 18.208.228.77:8081/smart-task-k8/task-service:latest
          ports:
            - containerPort: 5002
          env:
            - name: PORT
              value: "5002"
            - name: MONGO_URI
              value: "mongodb://mongodb:27017/taskdb"
            - name: JWT_SECRET
              value: "MySecret@123"

---
apiVersion: v1
kind: Service
metadata:
  name: task-service
  namespace: smart-task
spec:
  selector:
    app: task-service
  ports:
    - port: 5002
      targetPort: 5002
